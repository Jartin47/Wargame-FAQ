<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wargame Quick Reference — OTS Class 27-05</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mut:#5b6472;--line:#dfe3e8;--acc:#1f4e8c;--accbg:#e8eef7;--mark:#ffe58a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e6e9ee;--mut:#9aa4b2;--line:#2a313b;--acc:#7fb0ff;--accbg:#1c2a40;--mark:#6b5a12}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px 10px}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;max-width:1100px;margin:0 auto}
h1{font-size:17px;margin:0;white-space:nowrap}
h1 span{color:var(--mut);font-weight:500}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;font:inherit;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:2px solid var(--acc);border-color:transparent}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55}
.search input:focus~.kbd,.search input:not(:placeholder-shown)~.kbd{display:none}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 5px}
nav{display:flex;gap:6px;flex-wrap:wrap;max-width:1100px;margin:10px auto 0}
nav button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav button .n{color:inherit;opacity:.7;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:16px 20px 60px}
.status{color:var(--mut);font-size:13px;margin:4px 0 14px}
section h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--acc);margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
article h3{font-size:15px;margin:0 0 6px}
article p{margin:6px 0}
article ul,article ol{margin:6px 0;padding-left:20px}
article li{margin:2px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{background:var(--accbg)}
.src{margin-top:8px;font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--accbg);color:var(--acc);margin-left:6px;vertical-align:middle}
mark{background:var(--mark);color:inherit;border-radius:2px}
.empty{color:var(--mut);padding:30px 0;text-align:center}
.hide{display:none!important}
code{font-size:13px;background:var(--accbg);padding:0 4px;border-radius:3px}
footer{max-width:1100px;margin:0 auto;padding:0 20px 30px;color:var(--mut);font-size:12px}
@media print{header{position:static}nav,.kbd{display:none}article{break-inside:avoid}}
</style>
</head>

<footer>Built only from the team's own course files (user guides, orders, briefs, read files and the OPS intro video). Each entry names its source. Confirm against the current order for your block.</footer>
<script>
const GAMES = [["mce", "MCE Grading & Leadership"], ["ops", "Operation Pacific Shield"], ["cspoc", "OPS: CSpOC (Space)"], ["medcom", "OPS: MEDCOM"], ["afex", "AFEX"], ["ocs", "Operation Crimson Scorpion"], ["bs", "Operation Black Strike (WOC)"], ["mfr", "MFRs"]];
const ENTRIES = [{"id": "e0", "g": "mce", "t": "Grading Tools: the 7 leadership categories (L1\u2013L7)", "b": "<p>The instructor grades the Mission Commander on <b>how<\/b> they lead (AFH 36-2647 / USSF Competency Framework): \"it is not what people do but how they do their jobs.\"<\/p>\n<table><tr><th>#<\/th><th>Category<\/th><th>Effective<\/th><th>Exceeds<\/th><\/tr>\n<tr><td>L1<\/td><td>Military Character<\/td><td>Respectful, professional, disciplined, steady courage<\/td><td>Exceptional professionalism and humility under pressure<\/td><\/tr>\n<tr><td>L2<\/td><td>Critical Thinking &amp; Decision-Making<\/td><td>Spots relevant issues, weighs risk vs. benefit, applies lessons learned<\/td><td>Anticipates issues, considers multiple perspectives, develops others' thinking<\/td><\/tr>\n<tr><td>L3<\/td><td>Adaptability &amp; Flexibility<\/td><td>Adjusts to change, keeps mission focus and morale, shifts priorities<\/td><td>Embraces change, stays composed, leads others to adapt<\/td><\/tr>\n<tr><td>L4<\/td><td>Resource &amp; Org Stewardship<\/td><td>Uses resources well, sets clear priorities<\/td><td>Anticipates resource needs, ties them to the larger mission<\/td><\/tr>\n<tr><td>L5<\/td><td>Communication<\/td><td>Clear messages, confirms understanding, adapts to audience<\/td><td>Clear, high-impact messages that shape outcomes<\/td><\/tr>\n<tr><td>L6<\/td><td>Team Cohesion &amp; Conflict Resolution<\/td><td>Resolves conflict, keeps team engaged under pressure<\/td><td>Proactively manages team dynamics, drives engagement<\/td><\/tr>\n<tr><td>L7<\/td><td>Accountability &amp; Ownership<\/td><td>Takes ownership, applies feedback, owns success and failure<\/td><td>Fixes issues immediately, holds self and others accountable, seeks feedback<\/td><\/tr><\/table>", "k": "rubric form grade rating effective exceeds marginal unsatisfactory", "src": "10. MCE Brief (Intro) CAO 27-05", "cui": false}, {"id": "e1", "g": "mce", "t": "Pass / fail rules", "b": "<ul><li>Overall PASS/FAIL = the rating selected most often across L1\u2013L7.<\/li>\n<li>Any <b>Unsatisfactory in L1<\/b> (Military Character) = automatic FAIL.<\/li>\n<li><b>Two Unsatisfactory<\/b> ratings = automatic FAIL.<\/li>\n<li><b>Five or more<\/b> Marginal-or-below ratings = FAIL.<\/li><\/ul>\n<p>Practical target: zero Unsatisfactory and at least four Effective-or-better.<\/p>", "k": "pass fail unsat marginal automatic", "src": "10. MCE Brief (Intro) CAO 27-05", "cui": false}, {"id": "e2", "g": "mce", "t": "Mission brief format: ME3C2R", "b": "<ul><li><b>M<\/b>ission: commander's intent, objectives, tasks, end state<\/li>\n<li><b>E<\/b>nvironment: time of execution, weather, airspace/battlefield restrictions, DIME<\/li>\n<li><b>E<\/b>nemy: threat, most likely and most dangerous COA<\/li>\n<li><b>E<\/b>ffects: desired effects (MOEs)<\/li>\n<li><b>C<\/b>apabilities: assets and facilities; do you have what you need?<\/li>\n<li><b>C<\/b>OA: tasks, critical decision points, scheme of maneuver, comm plan, risk to mission and risk to force<\/li>\n<li><b>R<\/b>FI / LIMFACs: limiting factors, open RFIs, requests for support<\/li><\/ul>", "k": "brief briefing format mission environment enemy effects capabilities coa rfi limfac", "src": "10. MCE Brief (Intro) CAO 27-05", "cui": false}, {"id": "e3", "g": "mce", "t": "Debrief format", "b": "<ol><li>Mission overview in 3 minutes or less: task, what was executed, success or failure.<\/li>\n<li>Commander's intent met? Yes or no, and why.<\/li>\n<li>If yes: debrief focus points (DFPs) on how to improve in the leadership categories.<\/li>\n<li>If no: contributing factors, then root cause.<\/li><\/ol>", "k": "debrief hotwash dfp root cause contributing factors", "src": "10. MCE Brief (Intro) CAO 27-05", "cui": false}, {"id": "e4", "g": "mce", "t": "Mission command principles", "b": "<p>Clear commander's intent, shared understanding, disciplined initiative, mutual trust, prudent risk acceptance, and mission-type orders. Commander's intent says <i>what<\/i> and <i>why<\/i>, never <i>how<\/i>; the how belongs to subordinate commanders.<\/p>", "k": "mission command intent trust initiative risk mission type orders", "src": "10. MCE Brief (Intro) CAO 27-05; OPS intro video (Maj Troutman)", "cui": false}, {"id": "e5", "g": "ops", "t": "What OPS is", "b": "<p>Operation Pacific Shield is the OTS capstone wargame, adapted from the War College board game Kingfish ACE. It applies <b>Agile Combat Employment (ACE)<\/b> in a fictional conflict with China in the Indo-Pacific. The combined force sets the theater, proactively disperses from Main Operating Bases (MOBs) to Forward Operating Sites (FOSs), reactively disperses in response to enemy fires, masses effects on enemy targets, and runs contested logistics.<\/p>\n<p>ACE purpose: complicate the adversary's targeting, create political and operational dilemmas for the enemy, and increase flexibility and resiliency. Mission command is an ACE enabler.<\/p>", "k": "overview ace agile combat employment kingfish capstone", "src": "OPS intro video (Maj Troutman); OPS Expectations Brief v2", "cui": false}, {"id": "e6", "g": "ops", "t": "Teams and roles", "b": "<ul><li><b>CFACC / CAOC<\/b> (1 team): allocates mobility aircraft to the wings, verifies flight plans, issues PPRs, sets target priorities.<\/li>\n<li><b>Air Expeditionary Wings / MOBs<\/b> (4 teams): Kadena AB, Andersen AFB, Yokota AB, JBPHH. Each manages its MOB and up to 4 operational FOSs.<\/li>\n<li><b>CSpOC<\/b> and <b>MEDCOM<\/b> also play (see their sections).<\/li><\/ul>\n<p>The OPS objective: establish operational base clusters able to launch fighter sorties against CFACC and combined force objectives.<\/p>", "k": "cfacc caoc aew mob wing commander kadena andersen yokota jbphh", "src": "OPS intro video (Maj Troutman); OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e7", "g": "ops", "t": "Mission Points (MP): how you score", "b": "<table><tr><th>Action<\/th><th>Points<\/th><\/tr>\n<tr><td>Answer all 10 RFIs at one airfield<\/td><td>+5 MP<\/td><\/tr>\n<tr><td>Fighter sortie from a <b>FOS<\/b> into an operational hex (EXORD/FRAGORD)<\/td><td>+5 MP each (sorties from a MOB earn 0)<\/td><\/tr>\n<tr><td>Destroy PLA target<\/td><td>Higher-strength targets earn more MP but carry more risk (20-strength +10, 12-strength +7, 10-strength +5)<\/td><\/tr>\n<tr><td>Every 5 Demoralization Points<\/td><td>\u22121 MP<\/td><\/tr><\/table>\n<p>Mission points are tracked in the OPS Execution Spreadsheet.<\/p>", "k": "mission points score victory mp", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e8", "g": "ops", "t": "Demoralization Points (DP)", "b": "<ul><li>1 MP lost for every 5 DP.<\/li>\n<li>Deploying 2\u00d7 the personnel a task needs: d4 DP per game day; 3\u00d7: d10 DP per game day.<\/li>\n<li>No food or water: 10 DP the first day, then 30 DP per day.<\/li>\n<li>Beddown and sanitation must be in place in time (5\u201310 personnel = 4 turns, 11\u201320 = 2 turns, 21+ = 1 turn): 5 DP, then 10 per day.<\/li>\n<li>Health &amp; Welfare (Task #14) not done: 5 DP per day.<\/li><\/ul>", "k": "demoralization dp morale food water beddown overdeploy", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e9", "g": "ops", "t": "Resource Points (RP)", "b": "<p>Resource points represent host-nation relationships. Host Nation Relationship (Task #13) earns 2 RP per turn. At 3 RP the team gains one required resource token of its choice (food, water, tent or fuel).<\/p>", "k": "resource points host nation relationship task 13", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e10", "g": "ops", "t": "Time: turns, game days, execution blocks", "b": "<ul><li>A turn runs from mission planning to turn execution.<\/li>\n<li>Every other turn is skipped, so there are <b>4 turns per game day<\/b>.<\/li>\n<li><b>4 execution blocks<\/b>, each 3\u20134 hours and usually 2\u20133 turns.<\/li>\n<li>Timeline times are \"no later than\": you may go faster, never slower.<\/li><\/ul>", "k": "time turn game day block schedule", "src": "OPS intro video (Maj Troutman)", "cui": false}, {"id": "e11", "g": "ops", "t": "MCE block timeline (CAOC and MOB)", "b": "<table><tr><th>Time<\/th><th>Event<\/th><\/tr>\n<tr><td>00:00\u201300:45<\/td><td>30 min mission planning + 15 min mission pre-brief (each MC briefs in their own room)<\/td><\/tr>\n<tr><td>00:45\u201301:10<\/td><td>Turn 1 execution: MOB MCs report to the CAOC with loaded mobility aircraft on the ATO, fighters with bomb/missile/fuel, and risk tokens<\/td><\/tr>\n<tr><td>01:10\u201301:35<\/td><td>Turn 2 planning<\/td><\/tr>\n<tr><td>01:35\u201302:00<\/td><td>Turn 2 execution<\/td><\/tr>\n<tr><td>02:00\u201302:20<\/td><td>10 min hotwash/debrief to instructor + 10 min instructor feedback<\/td><\/tr><\/table>\n<p>Brief in the last 15 minutes of planning: it catches missed RFIs and gives MOBs time to brief their instructor.<\/p>", "k": "timeline schedule planning execution hotwash", "src": "OPS User Guide (CAO 09 Jun 26); OPS Expectations Brief v2", "cui": false}, {"id": "e12", "g": "ops", "t": "Turn sequence", "b": "<ol><li>Political assessment (base access/overflight) and aircraft apportionment<\/li>\n<li>Communication and runway status<\/li><li>Mission objectives / operational hexes<\/li>\n<li>Assess current airfields; select new ones if needed<\/li><li>RFIs<\/li>\n<li>CFACC assesses requirements and allocates mobility aircraft<\/li>\n<li>Load plans and flight plans on the ATO<\/li><li>CFACC verifies flight plans and issues PPRs<\/li>\n<li>Mission brief to instructor<\/li><li>Execution: adjudication released, mobility aircraft moved<\/li>\n<li>Fighter sorties launched and engagements adjudicated<\/li><li>Event and risk cards played (effects apply next turn)<\/li>\n<li>Download personnel/equipment and assign to airfield tasks<\/li><\/ol>\n<p>In conflict, PLA strikes are adjudicated at the <b>start<\/b> of the turn; friendly strikes happen at the <b>end<\/b>.<\/p>", "k": "turn order sequence steps phases", "src": "OPS intro video (Maj Troutman); OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e13", "g": "ops", "t": "Base access, overflight and political risk", "b": "<p>Base access and overflight are set by the EXORD/FRAGORD, with State Department negotiations simulated by a d10. They change only when the situation changes (crisis to conflict), an event card changes access, or a new execution block begins.<\/p>\n<p>If a country reverses access, fighters can no longer launch to operational areas from there. The host nation gives two turns to redeploy; after that, personnel and equipment are trapped as political prisoners until access changes.<\/p>\n<p>Planning tip from the video: the Philippines and Thailand are treaty allies with full access (low risk). India and Indonesia are easier to keep than Vietnam and Laos.<\/p>", "k": "political assessment base access overflight country risk d10", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e14", "g": "ops", "t": "FOS numbers by country", "b": "<table><tr><th>Country<\/th><th>FOS<\/th><\/tr>\n<tr><td>Japan<\/td><td>1\u20135<\/td><\/tr><tr><td>Philippines<\/td><td>6\u201310<\/td><\/tr>\n<tr><td>Indonesia<\/td><td>11, 12, 15\u201321<\/td><\/tr><tr><td>Brunei<\/td><td>13<\/td><\/tr>\n<tr><td>Singapore<\/td><td>22<\/td><\/tr><tr><td>Malaysia<\/td><td>14, 23, 24<\/td><\/tr>\n<tr><td>Thailand<\/td><td>25, 26, 30, 32\u201334<\/td><\/tr><tr><td>Cambodia<\/td><td>29<\/td><\/tr>\n<tr><td>Vietnam<\/td><td>27, 28, 31, 36, 37<\/td><\/tr><tr><td>Laos<\/td><td>35<\/td><\/tr>\n<tr><td>India<\/td><td>38\u201345<\/td><\/tr><\/table>\n<p>GEO Zone 1: FOS 1\u201318. GEO Zone 2: FOS 19\u201345.<\/p>", "k": "fos list country japan philippines indonesia thailand vietnam india geo zone", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e15", "g": "ops", "t": "RFIs (Requests for Information)", "b": "<ul><li>Headquarters assessment teams are limited, so each FOS gets <b>5 initial RFIs<\/b>. Wings can deploy their own assessment teams later to answer the remaining 5.<\/li>\n<li>Borrowing deployed people or equipment for an assessment team leaves the task they were doing incomplete that turn.<\/li>\n<li>RFI answers are host-nation support: cross the item off the board, don't place tokens. They stay with the airfield regardless of who occupies it and can't be moved.<\/li>\n<li>RFI-provided tasks also clear prerequisites elsewhere (e.g., #1 and #2 under #14).<\/li>\n<li>Ask RFIs in the spreadsheet's Airfield RFI tab: put an X in the orange cell for that FOS.<\/li>\n<li>If a wing already runs 4 FOSs, it must make one non-operational for the turn to ask RFIs at a new one.<\/li><\/ul>", "k": "rfi request for information assessment team host nation", "src": "OPS intro video (Maj Troutman); OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e16", "g": "ops", "t": "Airfield capability colors and upgrades", "b": "<table><tr><th>Color<\/th><th>Capability<\/th><th>Upgrade<\/th><\/tr>\n<tr><td>Red<\/td><td>C-17 and C-130 only; no fighters<\/td><td>Mobile arresting system \u2192 yellow<\/td><\/tr>\n<tr><td>Yellow<\/td><td>Mobility + daytime fighters<\/td><td>Runway/taxiway lighting \u2192 green<\/td><\/tr>\n<tr><td>Green<\/td><td>Mobility + day and night fighters<\/td><td>\u2014<\/td><\/tr><\/table>\n<p>Tell the game master when upgrade equipment is deployed; they update the Airfield Data tab.<\/p>", "k": "red yellow green arresting lighting upgrade runway capability", "src": "OPS intro video (Maj Troutman); OPS Expectations Brief v2", "cui": false}, {"id": "e17", "g": "ops", "t": "MOG, PPRs, throughput and ramp conversions", "b": "<ul><li>MOG = maximum aircraft on the ground at once. Ramp size comes from the MOG RFI.<\/li>\n<li>PPRs are issued by the CAOC for every planned landing. Throughput per turn = <b>2\u00d7 MOG<\/b>, but aircraft on the ground at the end of the turn must not exceed MOG. Example: MOG of 2 C-17s allows PPRs for 4 C-17s (or 2 C-5s, or 6 C-130s) per turn.<\/li>\n<li>Conversions: 2 C-17s = 3 C-130s = 1 C-5 of ramp space.<\/li>\n<li>MOBs have unlimited MOG and their ramps aren't targeted.<\/li>\n<li>The Station Workload table flags any airfield over its limit.<\/li><\/ul>", "k": "mog ppr throughput ramp conversion station workload", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e18", "g": "ops", "t": "Expanding a FOS parking ramp", "b": "<p>Requires an in-place Base Recovery Team (Task #15). MOG rises from 1 C-130 + 2 fighters to <b>2 C-17s + 7 fighters<\/b>, one turn after the team is in place. Recovery teams can't expand further (to 6 C-17s + 42 fighters).<\/p>", "k": "ramp expansion base recovery task 15 mog", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e19", "g": "ops", "t": "The 16 airfield tasks", "b": "<table><tr><th>Category<\/th><th>Tasks<\/th><\/tr>\n<tr><td>Establish<\/td><td>#1 Bed Down &amp; Sanitation, #2 Power, #3 Command &amp; Control, #4 Contracts<\/td><\/tr>\n<tr><td>Defend<\/td><td>#5 Ramp Security, #6 Perimeter Security, #7 Missile Defense, #8 Camouflage &amp; Base Hardening<\/td><\/tr>\n<tr><td>Operate<\/td><td>#9 Airfield Operations, #10 Mobility Support, #11 Integrated Combat Turns, #12 Specialized Fueling Operations<\/td><\/tr>\n<tr><td>Maintain<\/td><td>#13 Host Nation Relationships, #14 Health &amp; Welfare, #15 Base Recovery, #16 Logistics Support<\/td><\/tr><\/table>\n<ul><li><b>Fighters:<\/b> the User Guide requires all Establish <i>and<\/i> Operate tasks complete to receive and launch fighters. (The intro video says Operate at a minimum.)<\/li>\n<li>Red markers under a task are prerequisites (e.g., #2 Power before #1 Bed Down). Tasks needn't be done in order if prerequisites are met.<\/li>\n<li>One-time tasks (blue): #1, #2, #8. Afterwards the people (and forklift) can be reassigned; tents and generators stay.<\/li>\n<li>Contracting (blue $): needs #4 complete and money tokens; one contracted task per turn.<\/li>\n<li>#3 (C2): until complete, the FOS's data doesn't reach the CFACC dashboard.<\/li>\n<li>#8 is marked in the Airfield Data tab and stays complete all game. 10 personnel take 2 turns; 11\u201320 take 1 turn.<\/li><\/ul>", "k": "airfield tasks establish defend operate maintain prerequisite contract one-time c2 camouflage", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e20", "g": "ops", "t": "Personnel categories (Mission Ready Airmen)", "b": "<p>Three categories: <b>Mission Generation<\/b>, <b>Command and Control<\/b>, and <b>Base Operating Support-Integrator (BOS-I)<\/b>. With instructor approval, personnel of the same category and color can backfill tasks. Refueling, ammo and maintenance personnel must stay with their aircraft type (F-22 crews can service F-22s from another base).<\/p>", "k": "mra mca multi-capable personnel mission generation bos-i c2 counters", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e21", "g": "ops", "t": "Mobility aircraft: range, loads and flight plans", "b": "<ul><li>Range per turn: C-130 = 3 hexes; C-17 and C-5 = 4 hexes. 1 hex = 200 nm.<\/li>\n<li>An en-route download costs 1 hex of range. Max two downloads per turn (en-route stop + final destination).<\/li>\n<li>Load configurations: personnel only, cargo only, or mixed (C-5 has 2 options).<\/li>\n<li>A <b>forklift<\/b> must be at the airfield to download pallets. Wheeled items (e.g., a fire truck) don't need one. Task #10 need not be complete; loadmasters may run the forklift.<\/li>\n<li>Mobility aircraft can't overfly a hex with enemy capabilities unless a fighter escort launches into that hex the same turn (the escort can't strike that turn).<\/li>\n<li>Aircraft to/from JBPHH transit the South AOR entry point; the transit counts as one hex (not one turn as the board says).<\/li><\/ul>", "k": "c-130 c-17 c-5 range hex load forklift escort jbphh entry point", "src": "OPS User Guide (CAO 09 Jun 26); OPS Expectations Brief v2; OPS intro video (Maj Troutman)", "cui": false}, {"id": "e22", "g": "ops", "t": "ATO flight plan rules", "b": "<ul><li>Start at an airfield <b>or<\/b> a hex, never both.<\/li>\n<li>Fill the en-route stop only if the aircraft will land and download there.<\/li>\n<li>Mobility aircraft have unlimited fuel. Final destination = airfield with intent LAND, hex with intent ENROUTE, or HOLD.<\/li>\n<li>Alternate airfield is optional. Without one, an aircraft that can't land holds over its destination.<\/li>\n<li>Declare intent to use a risk token on the ATO.<\/li>\n<li>Any flight or load plan not complete when execution starts <b>misses its takeoff<\/b>.<\/li><\/ul>", "k": "ato air tasking order flight plan land hold enroute alternate", "src": "OPS intro video (Maj Troutman); OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e23", "g": "ops", "t": "Fighter sorties", "b": "<ul><li>Bring the fighter plus <b>1 bomb, 1 missile and 1 fuel token<\/b> to the CAOC for execution.<\/li>\n<li>Declare fighter allocation to a FOS one turn before it can fly from there. The first move MOB\u2192FOS takes one turn.<\/li>\n<li>Fighter range: 4 hexes. Fighters may land at another team's FOS but can relaunch only if that FOS has the right maintenance, ammo and fuel personnel and equipment.<\/li>\n<li>Crisis: munitions aren't expended and return with the fighter. Conflict: all munitions are expended in the operational area.<\/li>\n<li>No MP for sorties from a MOB.<\/li><\/ul>", "k": "fighter sortie token bomb missile fuel caoc range", "src": "OPS User Guide (CAO 09 Jun 26); OPS Expectations Brief v2", "cui": false}, {"id": "e24", "g": "ops", "t": "Commodities tax, sealift and USTRANSCOM", "b": "<ul><li>Tax at the end of each game day: under 25 personnel = 1 food, water and fuel every other day; over 25 = 1 each per day. Taxed food and water go back to the MOB.<\/li>\n<li>Sealift: each MOB gets 4 fuel, ammo, missile and bomb tokens at the start of each block.<\/li>\n<li>USTRANSCOM: 2 C-5s every other turn from Turn 1, max 6 at once. They land only at MOBs (risk tokens can't override this), download but don't upload, and can be re-fragged en route but not reloaded.<\/li>\n<li>TRANSCOM forecasts next block's mobility aircraft: \u00b13 C-130s/C-17s, \u00b11 C-5.<\/li><\/ul>", "k": "commodities tax food water fuel sealift transcom c-5 forecast", "src": "OPS User Guide (CAO 09 Jun 26); OPS Expectations Brief v2; OPS intro video (Maj Troutman)", "cui": false}, {"id": "e25", "g": "ops", "t": "Risk tokens", "b": "<ul><li>Allow risk outside normal rules (e.g., untrained personnel on a task, a C-5 landing at a FOS, an airdrop).<\/li>\n<li>2 per block in crisis, 4 per block in conflict. Annotate on the ATO and bring them to the CAOC.<\/li>\n<li>Default d10: 1 = failure (loss); 2\u20134 = success but damaged/injured, out for one turn; 5\u201310 = success.<\/li>\n<li>C-5 to a FOS, d20: 1\u20133 crash; 4\u20136 lands, broken 2 turns; 7\u201310 lands, broken 1 turn; 11\u201320 no damage.<\/li>\n<li>Airdrop of a runway repair team needs a risk token; C-5s can't airdrop.<\/li><\/ul>", "k": "risk token d10 d20 c-5 fos airdrop", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e26", "g": "ops", "t": "Event and risk cards", "b": "<p>One event and one risk card per turn. The CFACC rolls a d4 for the team, then a d4 for the FOS. Effects apply the <b>next<\/b> turn, at roughly 50% of the card's stated duration. One MEDCOM event card per block.<\/p>", "k": "event card risk card d4", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e27", "g": "ops", "t": "Comms degradation (information attacks)", "b": "<table><tr><th>Status<\/th><th>Cause<\/th><th>Effect<\/th><\/tr>\n<tr><td>Voice comm denied<\/td><td>Jamming (only within 2 hexes of a PLA jammer)<\/td><td>No verbal comms; can't leave the room. Teams chat and spreadsheet still work.<\/td><\/tr>\n<tr><td>Data sharing denied<\/td><td>Cyber attack (any targeted base)<\/td><td>No messaging apps; spreadsheet data for that base hidden (\"unknown\"). Verbal comms allowed; ask the GM for a verbal FOS status.<\/td><\/tr>\n<tr><td>Comm denied<\/td><td>Both<\/td><td>No chat, no leaving the room. Act on the last commander's intent.<\/td><\/tr><\/table>\n<p>Comms recover after one turn with no new attack (no Base Recovery Team needed). Update the \"jammer within 2 hexes\" yes/no each turn; a destroyed jammer removes the risk.<\/p>", "k": "comms jamming cyber voice data denied information attack", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e28", "g": "ops", "t": "PLA strikes on friendly airfields", "b": "<ul><li>The PLA must detect and target a base first. FOSs get more vulnerable the longer they're occupied, so enter each FOS's establishment turn in the spreadsheet.<\/li>\n<li><b>Runway hit (FOS):<\/b> drops to C-130 only, C-17/C-130 only, or non-operational until a Base Recovery Team is in place plus one turn. Fighters can't fly until full capability.<\/li>\n<li><b>Ramp hit:<\/b> MOG becomes a percentage. Aircraft above the new MOG are destroyed.<\/li>\n<li>C-17s/C-5s stuck at a runway degraded to C-130 only stay until repairs are complete.<\/li>\n<li><b>MOB runway:<\/b> degraded one turn, organic recovery. MOB ramps aren't targeted.<\/li>\n<li>Fighters always need a risk roll to take off/land on a damaged runway. C-5s always need one at a FOS.<\/li><\/ul>", "k": "pla strike kinetic runway ramp mog destroyed base recovery", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e29", "g": "ops", "t": "Consecutive strikes and FOS destruction", "b": "<ul><li>Without Base Recovery (#15), damage compounds: runway goes C-17/C-130 only \u2192 C-130 only \u2192 non-operational \u2192 destroyed; ramp loses another 15% per consecutive strike.<\/li>\n<li>Minimum strikes to destroy an airfield is three. If a fourth consecutive strike succeeds, everything at the airfield is destroyed.<\/li>\n<li><b>User Guide 8.3.3.3.1:<\/b> a FOS with <b>both<\/b> Base Recovery (#15) <b>and<\/b> Camouflage &amp; Base Hardening (#8) keeps taking damage without being fully destroyed.<\/li>\n<li>The intro video describes Base Recovery alone as enough; the written User Guide requires both.<\/li>\n<li>An airfield hit last turn isn't automatically targeted again.<\/li><\/ul>", "k": "consecutive strikes destroyed base recovery camouflage hardening", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e30", "g": "ops", "t": "Friendly strikes on PLA targets", "b": "<ul><li>Threat tokens: 10-based (ground targets/ballistic missiles), 12-based (4th-gen fighter, aircraft jammer), 20-based (5th-gen fighter), 0-based (anti-satellite jamming).<\/li>\n<li>Adjudication: PLA rolls a die equal to the target's strength; you roll a die equal to your aircraft's strength. Higher (after modifiers) wins; loser is removed.<\/li>\n<li><b>Force packaging:<\/b> two fighters vs. one target. Roll twice: full value of the first die plus half of the second. If the attack fails, both fighters are lost.<\/li>\n<li>Satellite jamming within 2 hexes (instructor rolls 6\u201310) or an aircraft jammer within 1 hex (4\u201310) adds a two-die modifier to each PLA token.<\/li>\n<li>CFACC may counter one PLA satellite jamming token for one turn, once per game, declared a turn in advance.<\/li>\n<li>Each conflict sortie uses 1 bomb, 1 missile and 1 fuel token.<\/li><\/ul>", "k": "strike adjudication dice force package jamming modifier threat token", "src": "OPS User Guide (CAO 09 Jun 26); OPS intro video (Maj Troutman)", "cui": false}, {"id": "e31", "g": "ops", "t": "MFR rules (creative thinking memos)", "b": "<ul><li>Write to Tongue &amp; Quill standards; submit to the assessing instructor.<\/li>\n<li>MOBs and the CSpOC: 1 active MFR at a time. CAOC: 3.<\/li>\n<li>Considered only after correctly answering an academic Sample of Behavior question.<\/li>\n<li>Requests affecting only one MOB/CSpOC are approved at that level. JOA-wide requests route to the CAOC assessing instructor.<\/li><\/ul>", "k": "mfr memorandum for record sample of behavior tongue quill", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e32", "g": "ops", "t": "Spreadsheet: which tab is yours", "b": "<ul><li>CFACC: Mission Dashboard only (political assessment, apportionment, airfield status, ATO, commodities, FOS capability).<\/li>\n<li>MOBs: Airfield RFI tab and their own team tab (orange cells = manual entry: commodities, fighters per FOS, jammer-in-range yes/no, DP total, ATO).<\/li>\n<li>Game masters: any tab. The Airfield Attack tab is GM-only.<\/li>\n<li>MEDCOM: MEDCOM tab only (see MEDCOM section).<\/li><\/ul>", "k": "spreadsheet excel tab dashboard team tab orange cells", "src": "OPS intro video (Maj Troutman)", "cui": false}, {"id": "e33", "g": "ops", "t": "Working with the CFACC", "b": "<ul><li>Give requirements in <b>people and pallet positions, in priority order<\/b>, separating the minimum for operational capability from extras (video example: FOS 28 needed 57 people and 9 PP minimum).<\/li>\n<li><b>Request effects, not assets<\/b>: ask for \"suppression of enemy air defenses,\" not \"an EA-18.\"<\/li>\n<li>The CFACC can divert fighters from a wing that's ready to cover another wing's tasks.<\/li>\n<li>CFACC: allocate early so wings have time for load and flight plans.<\/li><\/ul>", "k": "cfacc request effects assets pallet positions priority allocate", "src": "OPS intro video (Maj Troutman)", "cui": false}, {"id": "e34", "g": "ops", "t": "Choosing FOSs", "b": "<p>Don't build a single FOS: that just relocates the single point of failure. Weigh host-nation support from RFIs, political risk, distance to your operational hexes (fighter range 4 hexes) and distance to your MOB. Abandon a FOS that isn't worth the effort and evaluate another next turn.<\/p>\n<p>When collapsing a FOS, plan the order: pulling missile defense first exposes the old FOS; pulling it last exposes the new one.<\/p>", "k": "fos selection dispersal single point of failure collapse missile defense", "src": "OPS intro video (Maj Troutman)", "cui": false}, {"id": "e35", "g": "cspoc", "t": "CSpOC team and objective", "b": "<p>Team: Mission Commander, Deputy, Game Master, Communications POC (stays in CSpOC), Comms Liaison to the CAOC, and a Comms Liaison to each MOB. Remaining OTs fill roles at the MC's discretion. The CFSCC employs USSF assets, runs the CSpOC and communicates with the CFACC to meet JFC intent, including CCIRs outside the JOA.<\/p>", "k": "cspoc cfscc space team liaison", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e36", "g": "cspoc", "t": "Initial and subsequent satellite allocation", "b": "<p>Initial: 14 satellites + 1 cyber package. 1 Missile Warning (MEO), 1 SDA (LEO), 2 SDA (MEO), 1 COMM (LEO), 1 COMM (GEO), 2 ISR (LEO), 1 ISR (MEO), 1 Weather (LEO), 1 Weather (GEO), 1 Orbital Warfare (LEO), 1 GPS (LEO), 1 GPS (MEO), 1 cyber package (not in orbit).<\/p>\n<p>Each later block: 3 satellites, or 2 satellites + 1 cyber package. GPS, SDA and Orbital Warfare can never go in GEO. Every satellite needs a unique orbital position.<\/p>", "k": "satellite allocation leo meo geo cyber package", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e37", "g": "cspoc", "t": "Orbits and fuel chits", "b": "<ul><li><b>LEO<\/b> (green): stares at only the hex directly below; identifies targets fully on the first pass.<\/li>\n<li><b>MEO<\/b> (red): honeycomb scope, but pick one hex; first pass \"unidentified,\" second pass full ID.<\/li>\n<li><b>GEO<\/b> (black): doesn't move. MW, WX and COMM can use LEO/MEO/GEO; ISR, SDA, GPS and Dual-Use only LEO/MEO.<\/li>\n<li>One fuel chit per satellite for the whole game: change orbit (adjacent LEO\u2194MEO), delay, advance one extra, or fall back one. The target position must be empty.<\/li><\/ul>", "k": "orbit leo meo geo fuel chit fidelity stare", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e38", "g": "cspoc", "t": "CSpOC turn cycle and timeline", "b": "<ol><li>Draw an event card (not on Turn 1).<\/li><li>All satellites advance one position (GEO doesn't move); a satellite's first look happens after its first advance.<\/li>\n<li>Request looks; the GM adjudicates.<\/li><\/ol>\n<p>Timeline: 00:00\u201300:45 planning and pre-brief, then a look every 10 minutes from 00:45 to 02:05 (8 looks), then 02:05\u201302:25 hotwash and feedback.<\/p>", "k": "cspoc turn look event card timeline", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e39", "g": "cspoc", "t": "Blue capabilities", "b": "<table><tr><th>Satellite<\/th><th>Effect<\/th><\/tr>\n<tr><td>Missile Warning<\/td><td>Identifies 10-power SAM / ballistic missile threats (first pass, any orbit)<\/td><\/tr>\n<tr><td>Space Domain Awareness<\/td><td>Identifies threat and unknown satellites; finds enemy satellite jammers on the OPS board (first pass)<\/td><\/tr>\n<tr><td>Communications<\/td><td>Prevents voice comm degradation in its area<\/td><\/tr>\n<tr><td>ISR<\/td><td>Identifies 12-power, 20-power and airborne jammers<\/td><\/tr>\n<tr><td>Weather<\/td><td>Weather updates<\/td><\/tr>\n<tr><td>Orbital Warfare<\/td><td>Destroys identified threat satellites by dice roll<\/td><\/tr>\n<tr><td>GPS<\/td><td>+1 OPS dice modifier for U.S. forces in one hex<\/td><\/tr>\n<tr><td>Offensive Cyber<\/td><td>+1 modifier in one hex, once per OPS turn, coordinated <b>before<\/b> execution<\/td><\/tr><\/table>\n<p>Pass every dice modifier to the CFACC for fighter adjudication.<\/p>", "k": "missile warning sda comm isr weather orbital warfare gps cyber modifier", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e40", "g": "cspoc", "t": "Offensive operations and the GBR", "b": "<ul><li>Orbital Warfare vs. PRC Dual-Use: d20 each, highest wins (instructor rolls for PRC). Vs. any other PRC satellite: d10, 1\u20133 success, 4\u20137 fail, 8\u201310 both lost. Civilian satellites can't be targeted.<\/li>\n<li>Ground-Based Radar starts at Hickam, takes 8 pallet positions. Deployed to a FOS, it gives satellites in that GEO zone MEO scope with LEO fidelity.<\/li><\/ul>", "k": "orbital warfare attack d20 d10 gbr ground based radar", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e41", "g": "medcom", "t": "MEDCOM objective and team", "b": "<p>Stand up four hospitals at MOB Osan (not JBPHH), Kadena, Yokota and Andersen, moving assets from MEDCOM HQ at JBPHH with allocated mobility aircraft. Assign a Hospital Commander to each. Team: MC, Deputy, GM, Comms POC, Comms Liaison to the CAOC, and one to each MOB.<\/p>", "k": "medcom hospital osan kadena yokota andersen team", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e42", "g": "medcom", "t": "Aircraft, MEDEVAC and the ATO", "b": "<ul><li>MEDCOM may get C-130s, C-17s and/or C-5s. Only MEDCOM-allocated aircraft carry patients.<\/li>\n<li>Each aircraft is designated <b>Cargo<\/b> or <b>MEDEVAC<\/b> on the ATO, never both.<\/li>\n<li>A MEDEVAC flight needs 1 bandage, pharmaceutical, IV and oxygen token, declared and handed to the CAOC instructor.<\/li>\n<li>MEDCOM relies on other forces for fighter escort. Same number of risk tokens as MOBs.<\/li>\n<li>If tasks 9\u201312 are complete, green patients are treated in the air.<\/li><\/ul>", "k": "medevac cargo ato tokens bandage iv oxygen", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e43", "g": "medcom", "t": "Patients, treatment and CASEVAC", "b": "<ul><li>Treatment times: red 3 turns, yellow 2, green 1. Black = deceased after 1 turn. Never exceed bed space.<\/li>\n<li>CASEVAC: an HH-60 (Task #6 token) rescues downed U.S. pilots, max 6 patients, 3 hexes (600 nm). Announce right after the shootdown with helicopter and fuel tokens in hand. Through an enemy hex: PRC d12 vs. MEDCOM d20.<\/li>\n<li>Rescued pilots count as treated at a hospital with tasks 3 (triage) and 6 (medic response) complete.<\/li><\/ul>", "k": "patient treatment red yellow green casevac hh-60 bed space", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e44", "g": "medcom", "t": "MEDCOM scoring, tax and spreadsheet", "b": "<ul><li>Each casualty = 1 DP; each treated patient = 1 victory point; each CASEVAC rescue = 1 victory point.<\/li>\n<li>Daily tax: 1 each of blood, PPE, bandages, IV, oxygen, fuel, pharmaceutical. Can't pay = 5 DP.<\/li>\n<li>Sealift: 4 bandages, pharmaceuticals, IVs and oxygen per block. TRANSCOM resupply goes to JBPHH.<\/li>\n<li>Work on the MEDCOM DHA standalone Excel. One person may open the OPS Execution Excel on the MEDCOM tab only; viewing any other tab brings disciplinary action.<\/li><\/ul>", "k": "medcom victory points tax dha excel sealift", "src": "OPS User Guide (CAO 09 Jun 26)", "cui": false}, {"id": "e45", "g": "afex", "t": "Scenario and mission", "b": "<p>A fictitious conflict in which the U.S. conducts a Noncombatant Evacuation Operation (NEO) of <b>600 noncombatants<\/b> from Guantanamo Bay, Cuba, back to CONUS. Cuba threatened attack if the U.S. doesn't evacuate within 10 days.<\/p>\n<p>Tasks: deter Cuban aggression and posture for the NEO. If deterrence fails: gain and maintain air superiority; conduct and support counteroffensive operations; degrade enemy conventional power; prevent air or missile attacks; conduct NEO; resupply forward bases; recover downed aircrews.<\/p>\n<p>Assumptions: chemical and nuclear weapons restricted; Cuba may treat U.S. aircraft in its airspace as provocation.<\/p>\n<p>Note: the AFEX intro slides use a Stekira AB \u2192 Warnich AB version of the scenario; brief whichever scenario the host loads.<\/p>", "k": "neo guantanamo cuba 600 noncombatants scenario evacuation", "src": "AFEX User Guide (Holm Center); AFEX Introduction / Setup slides", "cui": false}, {"id": "e46", "g": "afex", "t": "How AFEX is evaluated", "b": "<p>The Victory Condition Report (View menu on the host) gives objective data: target effectiveness, aircraft losses, rescued crews, air refueling, ISR hits. It is data, not the verdict. The instructor also judges your <b>SMART objectives<\/b> and how well members lead, follow and communicate. Practice a full scenario first; it doubles as intelligence preparation of the battlespace.<\/p>", "k": "victory condition report smart objectives evaluation", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e47", "g": "afex", "t": "Network setup", "b": "<ul><li>Up to 7 computers and a router/Wi-Fi/LAN; practice solo vs. the computer first.<\/li>\n<li>The host finds its IP with <code>ipconfig<\/code> (format like 192.168.1.8); clients enter the host IP.<\/li>\n<li>Host = MC computer plus six team stations.<\/li>\n<li>Clients are limited to 0x, 1x and 2x run speed.<\/li><\/ul>", "k": "network host ip ipconfig computers lan setup", "src": "AFEX User Guide (Holm Center); AFEX Introduction / Setup slides", "cui": false}, {"id": "e48", "g": "afex", "t": "Controls: mouse and keys", "b": "<table><tr><th>Input<\/th><th>Action<\/th><\/tr>\n<tr><td>Space bar / 0x<\/td><td>Pause<\/td><\/tr>\n<tr><td>Left-click<\/td><td>Select flight or SAM site<\/td><\/tr>\n<tr><td>Right-click<\/td><td>Fly to, intercept, escort, or attack ground target<\/td><\/tr>\n<tr><td>Alt + right-click<\/td><td>Patrol between current location and point<\/td><\/tr>\n<tr><td>Ctrl + right-click<\/td><td>Force-fire ordnance or SAM<\/td><\/tr>\n<tr><td>Shift + right-click<\/td><td>Order menu (Fly To, Patrol, Attack, Hold, Delete)<\/td><\/tr>\n<tr><td>Ctrl + left-drag<\/td><td>Draw a patrol box / kill box<\/td><\/tr>\n<tr><td>Double-click airbase<\/td><td>Air Base Dialog (flights at that base)<\/td><\/tr>\n<tr><td>1, 2, 3, 4<\/td><td>Map zoom levels<\/td><\/tr>\n<tr><td>G<\/td><td>Generic orders (tracks/points)<\/td><\/tr>\n<tr><td>R<\/td><td>Return to base and land<\/td><\/tr><\/table>", "k": "controls keyboard mouse hotkey shortcut pause patrol force fire", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e49", "g": "afex", "t": "Map range indicators", "b": "<ul><li>Yellow: radar range. Red: missile/SAM/AAA range. Blue circle: visibility. Black circle: aircraft flight range. Brown circle: horizon for low flyers.<\/li>\n<li>Purple: jamming broadcast. Bright blue: SIGINT. Bright green: effective jamming. Dark green: ground radar coverage.<\/li><\/ul>", "k": "range ring color indicator radar sam jamming", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e50", "g": "afex", "t": "Fuel, Bingo, Winchester and refueling", "b": "<ul><li><b>Bingo<\/b>: low fuel, return or refuel. <b>Winchester<\/b>: primary ordnance expended.<\/li>\n<li>Range color: white &gt; 2/3, yellow &lt; 2/3, red &lt; 1/3. Fly slower/higher to extend range.<\/li>\n<li>Out of fuel or unable to return when the game ends = <b>fuel kill<\/b>.<\/li>\n<li>Refuel: match boom (b) or probe (p) and airspeed; tankers patrol at minimum airspeed; select receiver and right-click the tanker. Avoid max (red) speed except in emergencies.<\/li><\/ul>", "k": "bingo winchester fuel kill refuel tanker boom probe", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e51", "g": "afex", "t": "Team 1: Global Precision Attack", "b": "<p>B-1B (BSU-49), B-2 (BSU-50): effective on all targets, recommended for runways and control centers. B-52H: AGM-86C CALCM vs. radar sites and point targets, plus an aerial radar jammer. Based at Moody AFB.<\/p>\n<p>Tasks: use bombers to weaken the adversary's ability to engage; suppress/destroy the SAM network; interdict ground forces. Assessed on destroying prioritized targets.<\/p>", "k": "bomber b-1 b-2 b-52 strategic attack moody", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e52", "g": "afex", "t": "Team 2: Counterair (Offensive)", "b": "<p>F-22, F-15C, F-16CM with AIM-120 (medium range, multi-aspect) and AIM-9 (short range, can't fire nose-to-nose). Based at Patrick AFB.<\/p>\n<p>Tasks: air superiority; sweep and destroy threatening aircraft; destroy aircraft on the ground; neutralize SAMs with SEAD; escort airlift, tankers and CSAR. Assessed on SAM kills and air-to-air/air-to-surface kills.<\/p>", "k": "oca offensive counterair f-22 f-15c f-16 sweep escort patrick", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e53", "g": "afex", "t": "Team 3: Counterair (Defensive)", "b": "<p>F-15E with AGM-154A JSOW (radar and SAM sites) and GBU-31 JDAM (good vs. SAMs and control centers, ~28% damage vs. ramps, buildings, runways). Based at MacDill AFB.<\/p>\n<p>Tasks: local air superiority; assist sweep and escort. Assessed on preventing friendly losses and minimizing fuel losses (coordinate with Air Mobility).<\/p>", "k": "dca defensive counterair f-15e jsow jdam macdill", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e54", "g": "afex", "t": "Team 4: Air Mobility", "b": "<p>C-17, C-5, C-130E/J (cargo/passengers) and KC-135, KC-10 (refueling). Based at Savannah AFB.<\/p>\n<p>Tasks: airlift medical supplies to the NEO site; airlift the Americans from Guantanamo; air refueling. Passengers and cargo can't share an aircraft. Assessed mainly on moving passengers to CONUS, plus resupply and refueling.<\/p>", "k": "air mobility c-17 c-5 c-130 kc-135 kc-10 airlift passengers savannah", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e55", "g": "afex", "t": "Team 5: Global Integrated ISR", "b": "<p>RQ-4, MQ-9, U-2S (imagery/SIGINT), E-3 (AWACS), RC-135V (Rivet Joint), F-16CM Wild Weasel (AGM-88 HARM, AGM-65K), EA-6B (jammer), EC-130H (cyber/jamming). Based at Tyndall AFB.<\/p>\n<p>Tasks: detect and classify enemy air missions, radars, SAMs and command nodes; suppress/jam air defenses. Assessed on detecting and classifying enemy capabilities.<\/p>", "k": "isr rq-4 mq-9 u-2 e-3 rc-135 wild weasel harm ea-6b ec-130 tyndall sead", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e56", "g": "afex", "t": "Team 6: Personnel Recovery", "b": "<p>CV-22, HH-60G (rescue), AC-130U (gunship), EC-130H/P (refuel), A-10 (JDAM, AGM-65K, Hydra 70, AIM-9). Based at Homestead AFB.<\/p>\n<p>Rescue: select the rescue flight and right-click the downed crew icon; \"Has Rescue\" lights up when successful. Crews unload at any airfield or ship. Provide RESCAP with strafe-capable aircraft to delay capture. Enemy crews can't be picked up.<\/p>", "k": "personnel recovery csar hh-60 cv-22 a-10 ac-130 rescue homestead rescap", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e57", "g": "afex", "t": "Weather, night, recon and BDA", "b": "<ul><li>Targets under cloud can only be hit with bombing radar or GPS weapons; no recon under cloud.<\/li>\n<li>At night, bombing needs FLIR, bombing radar or GPS ordnance.<\/li>\n<li>Recon: each recon aircraft does one recon per scenario, and each location can be reconned once. Damage after recon earns bonus points.<\/li>\n<li>BDA: destroyed static targets show as a flaming box. A SAM with its radar out isn't shown destroyed until 100% destroyed.<\/li>\n<li>Ramp damage destroys a proportional share of parked aircraft; building damage destroys stored fuel/ordnance.<\/li><\/ul>", "k": "weather cloud night recon bda ramp building damage", "src": "AFEX User Guide (Holm Center)", "cui": false}, {"id": "e58", "g": "ocs", "t": "What Crimson Scorpion is", "b": "<p>A tactical-to-low-operational MCE in the near future showing how cyber, space and maritime actions affect the air battle. Adapted from the Air Force Wargaming Institute's AFWI and AFWE games. A campaign of <b>two ATO cycles<\/b>, scored by a hidden Mission Card. Blue = USA/Allies, Red = PRC/Russia.<\/p>\n<p>Note: at least one past flight played Operation BLACK STRIKE in place of OCS.<\/p>", "k": "crimson scorpion ocs overview afwi blue red", "src": "OCS User Guide (17 Feb 26); War Game Training Accountability", "cui": false}, {"id": "e59", "g": "ocs", "t": "Setup", "b": "<ol><li>Lay out the board; split into Blue and Red.<\/li><li>Each team puts a cube on CYBER TRACK +1 and INTEL TRACK NORMAL.<\/li>\n<li>Select the Mission Card (hidden). Choose a posture card (visible): it sets enabler cards, squadron cards and special abilities.<\/li>\n<li>Place squadrons on the AIRBASE or (Blue only) the CONTINGENCY LOCATION; aircraft/ADA tokens face down on squadron cards.<\/li>\n<li>Choose enabler cards secretly.<\/li><\/ol>", "k": "setup mission card posture squadron enabler", "src": "OCS User Guide (17 Feb 26)", "cui": false}, {"id": "e60", "g": "ocs", "t": "Contingency Location: pros and cons", "b": "<p><b>Advantage:<\/b> protection from splash damage that hits multiple squadrons on the Airbase. <b>Disadvantage:<\/b> activating a squadron there means rolling a d4; the result limits how many of its tokens can be used for the whole ATO. Exploding-die damage on the Contingency Location can hit only one squadron card per attack.<\/p>", "k": "contingency location dispersal splash d4", "src": "OCS User Guide (17 Feb 26)", "cui": false}, {"id": "e61", "g": "ocs", "t": "Initiative, Cyber Track and Intel", "b": "<ul><li>Initiative: each leader rolls a d4 (reroll ties). Winner gets INTEL ADVANTAGE, chooses who goes first, and gets a chance to raise their Cyber Rate.<\/li>\n<li>Cyber Track 0\u20134, both start at 1. To raise it, match or beat the number between current and next rate. <b>Reaching 4 immediately ends the ATO as a win.<\/b><\/li>\n<li>Intel: each leader rolls a d4 for how many enemy enabler cards are revealed; INTEL ADVANTAGE rolls two and takes the higher (once). At least one enabler must stay hidden.<\/li><\/ul>", "k": "initiative cyber track intel advantage d4 win", "src": "OCS User Guide (17 Feb 26)", "cui": false}, {"id": "e62", "g": "ocs", "t": "Turn actions", "b": "<p>In order: (1) Pass, or (2) use an Enabler card, then (3A) <b>activate a squadron<\/b> (ends your turn) <b>or<\/b> (3B) <b>Move-Acquire-Shoot<\/b> with active tokens. You can't activate and MAS in the same turn. The ATO cycle ends when both leaders pass in succession or no moves remain.<\/p>\n<p>Activation: flip the squadron card face up and place its tokens face down in the band its \"Generate\" line specifies (usually band 1; some in Standoff or any band).<\/p>", "k": "turn pass enabler activate squadron move acquire shoot mas", "src": "OCS User Guide (17 Feb 26)", "cui": false}, {"id": "e63", "g": "ocs", "t": "Move-Acquire-Shoot (MAS)", "b": "<ul><li>One move, one acquire, one shoot per turn, in any order, from different tokens if you like; any step can be skipped.<\/li>\n<li>Tokens enter unacquired. Acquired tokens flip face up for the rest of the ATO.<\/li>\n<li>Tokens generally must be acquired before they can be engaged; tokens on an Airbase or Contingency Location can be engaged without acquisition.<\/li>\n<li>Placing a token via an enabler, removing one, or returning a Winchester token isn't a move.<\/li><\/ul>", "k": "move acquire shoot mas acquisition", "src": "OCS User Guide (17 Feb 26)", "cui": false}, {"id": "e64", "g": "ocs", "t": "Winchester and regeneration", "b": "<ul><li>A token rolling under 4 goes Winchester (cube on it). A 4 means it kept weapons.<\/li>\n<li>ADA never goes Winchester. Attack UAS go Winchester only on 1\u20132. Naval tokens track gray salvo blocks; a 4 preserves a weapon.<\/li>\n<li>At the start of a turn, Winchester air tokens return to their squadron card (free); Winchester naval tokens leave the board.<\/li>\n<li>To fly again, re-activate the squadron, which ends your turn.<\/li><\/ul>", "k": "winchester ammo regeneration uas naval salvo", "src": "OCS User Guide (17 Feb 26)", "cui": false}, {"id": "e65", "g": "ocs", "t": "Damage and Airbase targets", "b": "<ul><li>A token dies to 1 hit; a squadron card needs 2.<\/li>\n<li>Destroying a squadron card with its tokens on the ground (not generated or returned) destroys all of them.<\/li>\n<li>The Airbase has 3 extra damage blocks for VPs; hitting them doesn't affect assets.<\/li>\n<li>Exploding die: the attacker distributes uncancelled damage within the enemy Airbase.<\/li>\n<li>At ATO end, airborne units return to their squadron card. One landing on a destroyed squadron is destroyed and scored by the opponent.<\/li><\/ul>", "k": "damage hits squadron card airbase exploding die vp", "src": "OCS User Guide (17 Feb 26)", "cui": false}, {"id": "e66", "g": "ocs", "t": "Missile defense", "b": "<ul><li>Any attack crossing the WEZ of a generated missile-defense token (ADA, or naval with the indicator) can be defended.<\/li>\n<li>Declare <b>immediately after the attack is declared<\/b>, before any hit roll, damage roll or enabler card.<\/li>\n<li>Defended attacks roll at <b>disadvantage<\/b> (two d4, use the lower) for hit and damage.<\/li>\n<li>Naval missile defense spends a gray air salvo block. Generated ground ADA always puts enemy shots on surface targets in its WEZ at disadvantage.<\/li>\n<li>\"Unblockable\" enablers and the two PRC SOF Direct Action cards ignore missile defense.<\/li><\/ul>", "k": "missile defense wez disadvantage ada naval unblockable", "src": "OCS User Guide (17 Feb 26)", "cui": false}, {"id": "e67", "g": "ocs", "t": "End of ATO and scoring", "b": "<ul><li>Used single-use enablers leave the game. Count destroyed enemy units for VPs.<\/li>\n<li>Active tokens and squadrons are cleared and can't be used next ATO. Non-activated squadrons destroyed this ATO return after scoring.<\/li>\n<li>Cyber Track resets to 1. Start the next ATO if any.<\/li>\n<li>Game end: reveal Mission Cards, tally VPs per their scoring conditions; most VPs wins.<\/li><\/ul>", "k": "scoring end ato victory points mission card", "src": "OCS User Guide (17 Feb 26)", "cui": false}, {"id": "e68", "g": "bs", "t": "Mission, intent and end state", "b": "<p><b>Situation:<\/b> the PRC has blockaded Taiwan, seized the Kinmen Islands and postured for invasion.<\/p>\n<p><b>Mission:<\/b> execute Operation BLACK STRIKE by degrading PLA command and control (C2) and integrated air defense system (IADS) effectiveness.<\/p>\n<p><b>Intent:<\/b> halt invasion momentum by severing PLA C2 and A2/AD, weakening the enemy defensive shield and creating conditions for coalition freedom of action.<\/p>\n<p><b>End state:<\/b> regional stability restored, Taiwan's sovereignty preserved, air and sea lines of communication secured, PRC compelled to cease aggression and return to diplomacy.<\/p>", "k": "black strike mission intent end state taiwan c2 iads", "src": "(EX) Operation BLACK STRIKE Template", "cui": false}, {"id": "e69", "g": "bs", "t": "Enemy and centers of gravity", "b": "<ul><li>Most likely COA: annexation of Taiwan (joint firepower strike and amphibious/airborne assault after seizing outlying islands).<\/li>\n<li>Most dangerous COA: strategic entanglement (PRC defense pacts in the Middle East and South America).<\/li>\n<li>Strategic COG: the CCP Central Military Commission's centralized C2 network.<\/li>\n<li>Operational COG: the PLA's integrated A2/AD network.<\/li><\/ul>", "k": "enemy coa center of gravity cog a2ad", "src": "(EX) Operation BLACK STRIKE Template", "cui": false}, {"id": "e70", "g": "bs", "t": "Brief template and environment", "b": "<p>Brief order: Mission, Enemy, Measures of Effectiveness, Environment, Capabilities, COA, Communications Plan, LIMFACs.<\/p>\n<p>Execution 20300817 0800Z; sunny, 51\u201376\u00b0F. PRC battlespace is organized into Northern, Southern, Eastern, Western and Central Theater Commands.<\/p>\n<p>U.S. Air Force capabilities include 8 F-15EX, 8 F-16CM, 14 F-22A and 3 B-2, plus Navy forces.<\/p>", "k": "template brief moe environment capabilities f-15ex f-16 f-22 b-2", "src": "(EX) Operation BLACK STRIKE Template", "cui": false}, {"id": "e71", "g": "bs", "t": "AOC divisions: who does what", "b": "<table><tr><th>Division<\/th><th>Bottom line<\/th><\/tr>\n<tr><td>JFACC<\/td><td>Ensure delivery of a cohesive and effective air campaign<\/td><\/tr>\n<tr><td>Strategy (SRD)<\/td><td>Answer \"How will airpower address the strategic objectives?\"<\/td><\/tr>\n<tr><td>ISR (ISRD)<\/td><td>Identify all relevant threats to operations<\/td><\/tr>\n<tr><td>Combat Plans (CPD)<\/td><td>Assign aircraft to tasks (the ATO)<\/td><\/tr>\n<tr><td>Combat Ops (COD)<\/td><td>Day-of-execution communication: the <b>only<\/b> division that can talk to Blue on execution day<\/td><\/tr><\/table>", "k": "jfacc srd isrd cpd cod division aoc roles", "src": "Read File WOC; BLACK STRIKE OPS FRAGORD v7", "cui": false}, {"id": "e72", "g": "bs", "t": "Weapon engagement ranges", "b": "<table><tr><th>Aircraft<\/th><th>Weapons (range)<\/th><\/tr>\n<tr><td>F-15<\/td><td>AIM-9 9.6 nm; MK-81 13 nm; GBU-39 60 nm; AGM-158 500 nm<\/td><\/tr>\n<tr><td>F-22<\/td><td>AIM-9X 5.4 nm; AIM-120 86.4 nm<\/td><\/tr>\n<tr><td>B-2<\/td><td>JDAM 13 nm; AGM-154 250 nm; AGM-158 500 nm<\/td><\/tr>\n<tr><td>F-16<\/td><td>AIM-9 9.6 nm; AIM-120 86.4 nm<\/td><\/tr>\n<tr><td>J-20<\/td><td>PL-10 10.8 nm; <b>PL-15 162 nm<\/b><\/td><\/tr>\n<tr><td>J-10 / J-11<\/td><td>PL-8 8.1; PL-11 13.5; PL-12 54; <b>PL-15 162 nm<\/b><\/td><\/tr>\n<tr><td>J-16<\/td><td>PL-10 10.8; PL-12 54 nm. J-16 EW: YJ-91 27 nm<\/td><\/tr>\n<tr><td>J-8<\/td><td>PL-5 8.6; PL-11 13.5; PL-12 54 nm<\/td><\/tr>\n<tr><td>FT-2000 SAM<\/td><td>64.8 nm<\/td><\/tr><\/table>\n<p>The PL-15 outranges the AIM-120 by about 75 nm.<\/p>", "k": "range weapons aim-120 pl-15 jdam agm-158 ft-2000 missile", "src": "Read File WOC", "cui": false}, {"id": "e73", "g": "bs", "t": "Aircraft strengths and limitations", "b": "<ul><li><b>F-22<\/b>: stealth, supercruise, first-look/first-shot; limited data sharing with 4th-gen aircraft.<\/li>\n<li><b>B-2<\/b>: penetrates dense defenses, ~6,000 nm unrefueled range; only 21 exist, coatings need heavy maintenance.<\/li>\n<li><b>F-15 / F-16<\/b>: proven, high payload/agility; not stealthy, vulnerable to modern defenses.<\/li>\n<li><b>J-20<\/b>: China's 5th-gen fighter with long-range BVR; stealth considered less effective than F-22/F-35.<\/li>\n<li><b>J-10C / J-11 / J-16<\/b>: 4.5-gen with AESA radar and PL-15; non-stealthy. J-16D is a SEAD/EW variant.<\/li>\n<li><b>J-8<\/b>: fast Cold War interceptor; obsolete against modern fighters.<\/li><\/ul>", "k": "f-22 b-2 f-15 f-16 j-20 j-10 j-11 j-16 j-8 strengths limitations", "src": "Read File WOC", "cui": false}, {"id": "e74", "g": "bs", "t": "Execution-day manning", "b": "<p>On execution day SRD and CPD fold into the other divisions. COD runs at least 3 pilots in VR simulators plus 2 radio operators, and only COD communicates with Blue forces.<\/p>", "k": "execution day pilots vr radio operators cod", "src": "BLACK STRIKE OPS FRAGORD v7; Read File WOC", "cui": false}, {"id": "e75", "g": "mfr", "t": "MFR format (Tongue & Quill)", "b": "<ul><li>Date right-aligned; MEMORANDUM FOR, FROM, SUBJECT with two spaces after each colon.<\/li>\n<li>Two spaces after paragraph numbers. Subparagraphs indent a., then (1). Numbering restarts under each new lettered paragraph.<\/li>\n<li>Signature block starts 3.5\" from the left margin, on the 5th line below the text.<\/li>\n<li>Electronic signature: <b>//SIGNED//<\/b> (two slashes each side, uppercase) directly above the name.<\/li>\n<li>Request <b>effects, not assets<\/b>.<\/li><\/ul>", "k": "mfr format signed signature block tongue quill memo", "src": "Example memorandum; OPS intro video (Maj Troutman)", "cui": false}, {"id": "e76", "g": "mfr", "t": "Pre-built MFR library (16 memos)", "b": "<table><tr><th>#<\/th><th>MFR<\/th><th>Cell<\/th><\/tr>\n<tr><td>1<\/td><td>Additional planning/execution time<\/td><td>Any<\/td><\/tr>\n<tr><td>2<\/td><td>Additional mobility airlift<\/td><td>MOB<\/td><\/tr>\n<tr><td>3<\/td><td>Host-nation contracted support<\/td><td>MOB<\/td><\/tr>\n<tr><td>4<\/td><td>Multi-Capable Airmen<\/td><td>MOB<\/td><\/tr>\n<tr><td>5<\/td><td>Spoke risk acceptance<\/td><td>MOB<\/td><\/tr>\n<tr><td>6<\/td><td>Emergency commodity resupply<\/td><td>MOB<\/td><\/tr>\n<tr><td>7<\/td><td>Cross-servicing fighters at a partner FOS<\/td><td>MOB<\/td><\/tr>\n<tr><td>8<\/td><td>Expedited airfield repair<\/td><td>MOB<\/td><\/tr>\n<tr><td>9<\/td><td>USTRANSCOM C-5 surge<\/td><td>CAOC<\/td><\/tr>\n<tr><td>10<\/td><td>Mid-block reapportionment<\/td><td>CAOC<\/td><\/tr>\n<tr><td>11<\/td><td>Allied and partner integration (effects)<\/td><td>CAOC<\/td><\/tr>\n<tr><td>12<\/td><td>Satellite fuel chit / launch<\/td><td>CSpOC<\/td><\/tr>\n<tr><td>13<\/td><td>Ground-based radar redeployment<\/td><td>CSpOC<\/td><\/tr>\n<tr><td>14<\/td><td>MEDEVAC lift and escort<\/td><td>MEDCOM<\/td><\/tr>\n<tr><td>15<\/td><td>Allied/host-nation medical support<\/td><td>MEDCOM<\/td><\/tr>\n<tr><td>16<\/td><td>Air defense suppression and support effects<\/td><td>Black Strike<\/td><\/tr><\/table>\n<p>Word files are in the team's Wargaming\\MFRs folder.<\/p>", "k": "mfr library list templates", "src": "Flight 16 MFR library", "cui": false}];
const content = document.getElementById('content'), q = document.getElementById('q'),
      nav = document.getElementById('nav'), statusEl = document.getElementById('status'), empty = document.getElementById('empty');
let active = 'all';

// Build DOM once
const plain = {};
GAMES.forEach(([id, name]) => {
  const items = ENTRIES.filter(e => e.g === id);
  if (!items.length) return;
  const sec = document.createElement('section'); sec.id = 's-' + id; sec.dataset.g = id;
  sec.innerHTML = '<h2>' + name + '</h2><div class="grid"></div>';
  const grid = sec.querySelector('.grid');
  items.forEach(e => {
    const a = document.createElement('article'); a.id = e.id; a.dataset.g = id;
    a.innerHTML = '<h3>' + e.t + (e.cui ? '<span class="tag">from orders</span>' : '') + '</h3><div class="body">' + e.b + '</div><div class="src">Source: ' + e.src + '</div>';
    grid.appendChild(a);
    const tmp = document.createElement('div'); tmp.innerHTML = e.t + ' ' + e.b;
    plain[e.id] = (tmp.textContent + ' ' + e.k + ' ' + name + ' ' + e.src).toLowerCase();
    a._orig = a.innerHTML;
  });
  content.appendChild(sec);
});

function navBuild(counts) {
  nav.innerHTML = '';
  const mk = (id, label, n) => { const b = document.createElement('button'); b.textContent = label;
    if (n !== undefined) { const s = document.createElement('span'); s.className = 'n'; s.textContent = n; b.appendChild(s); }
    b.className = active === id ? 'on' : ''; b.onclick = () => { active = id; run(); if (id !== 'all') window.scrollTo({top: 0}); }; nav.appendChild(b); };
  mk('all', 'All', counts.all);
  GAMES.forEach(([id, name]) => { if (counts[id] !== undefined) mk(id, name, counts[id]); });
}

function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function highlight(node, terms) {
  if (!terms.length) return;
  const re = new RegExp('(' + terms.map(esc).join('|') + ')', 'gi');
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  const hits = []; let t; while ((t = walker.nextNode())) if (re.test(t.nodeValue)) hits.push(t);
  hits.forEach(t => { const span = document.createElement('span'); span.innerHTML = t.nodeValue.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(re, '<mark>$1</mark>'); t.replaceWith(span); });
}

function run() {
  const raw = q.value.trim().toLowerCase();
  const terms = raw.split(/\s+/).filter(Boolean);
  const counts = {all: 0}; let shown = 0;
  ENTRIES.forEach(e => {
    const a = document.getElementById(e.id);
    const match = terms.every(w => plain[e.id].includes(w));
    counts[e.g] = (counts[e.g] || 0) + (match ? 1 : 0);
    if (match) counts.all++;
    const vis = match && (active === 'all' || active === e.g);
    a.classList.toggle('hide', !vis);
    if (a._hl || terms.length) { a.innerHTML = a._orig; a._hl = false; }
    if (vis && terms.length) { highlight(a, terms); a._hl = true; }
    if (vis) shown++;
  });
  document.querySelectorAll('section').forEach(s => {
    s.classList.toggle('hide', !s.querySelector('article:not(.hide)'));
  });
  navBuild(counts);
  empty.classList.toggle('hide', shown > 0);
  statusEl.textContent = (terms.length ? shown + ' result' + (shown === 1 ? '' : 's') + ' for "' + q.value.trim() + '"' : shown + ' entries') +
    (active !== 'all' ? ' in ' + GAMES.find(g => g[0] === active)[1] : '');
  const p = new URLSearchParams(); if (raw) p.set('q', q.value.trim()); if (active !== 'all') p.set('g', active);
  history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
}

const init = new URLSearchParams(location.search);
if (init.get('q')) q.value = init.get('q');
if (init.get('g') && GAMES.some(g => g[0] === init.get('g'))) active = init.get('g');
let timer; q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 80); });
document.addEventListener('keydown', ev => {
  if (ev.key === '/' && document.activeElement !== q) { ev.preventDefault(); q.focus(); q.select(); }
  else if (ev.key === 'Escape' && document.activeElement === q) { q.value = ''; run(); }
});
run();
</script>
